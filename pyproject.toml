[project]
name = "sfp-bot"
version = "1.1.0"
description = "SFP bot for BingX"
dependencies = [
    "flet>=0.28.0",
    "requests>=2.31.0",
]

[tool.flet]
org = "com.sfpbot.app"
product = "ByBing Bot"

[tool.flet.android]
min_sdk_version = 26    # FOREGROUND_SERVICE: с API 26+, POST_NOTIFICATIONS — с 33 (право просто игнорируется ниже)

[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.WAKE_LOCK" = true
"android.permission.FOREGROUND_SERVICE" = true
"android.permission.FOREGROUND_SERVICE_SPECIAL_USE" = true
"android.permission.POST_NOTIFICATIONS" = true
"android.permission.RECEIVE_BOOT_COMPLETED" = true
