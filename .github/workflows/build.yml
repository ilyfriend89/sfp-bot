name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # КЛЮЧЕВОЙ ШАГ: устанавливаем Flutter нужной версии вручную
      - name: Install Flutter 3.27.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      # КЛЮЧЕВОЙ ШАГ: принимаем лицензии Android SDK
      - name: Accept Android licenses
        run: |
          yes | flutter doctor --android-licenses || true
          flutter doctor -v

      # КЛЮЧЕВОЙ ШАГ: устанавливаем flet-cli и патчим его
      - name: Install flet-cli
        run: |
          pip install flet-cli
          # Патчим flet-cli, чтобы он не спрашивал подтверждение
          python -c "
          import flet_cli.commands.flutter_base as m
          # Перехватываем _prompt_input — всегда возвращаем True
          m.FlutterBaseCommand._prompt_input = lambda self, prompt: True
          " 2>/dev/null || true

      # КЛЮЧЕВОЙ ШАГ: запускаем сборку с автоподтверждением
      - name: Build APK
        run: |
          echo "y" | flet build apk --verbose --arch arm64-v8a || \
          yes | flet build apk --verbose --arch arm64-v8a

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bot-apk-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
