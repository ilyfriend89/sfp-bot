name: build-apk
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
      - name: Flutter doctor (диагностика)
        run: flutter doctor -v
      - name: Принять лицензии Android (системный SDK)
        run: yes | flutter doctor --android-licenses || true
      - run: pip install flet
      - name: Первая сборка (готовит SDK flet, может упасть на лицензиях)
        run: yes | flet build apk --verbose
        continue-on-error: true
      - name: Принять лицензии для SDK flet
        run: |
          SM=$(find $HOME /opt/hostedtoolcache -type f -name sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager: $SM"
          [ -n "$SM" ] && yes | "$SM" --licenses || true
      - name: Повторная сборка
        run: yes | flet build apk --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: bot-apk
          path: build/apk/**/*.apk
