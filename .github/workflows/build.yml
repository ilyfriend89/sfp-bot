name: build-apk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
      - name: GTK-библиотеки для flutter doctor
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev mesa-utils
      - name: Flutter doctor
        run: flutter doctor -v
      - run: pip install flet
      - name: Сборка APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m"
        run: flet build apk --verbose --arch arm64-v8a
      - name: Диагностика размеров
        run: find build -name "*.apk" -exec ls -lh {} \;
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bot-panel-apk
          path: build/apk/**/*.apk
