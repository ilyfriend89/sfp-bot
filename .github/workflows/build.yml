name: build-apk
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install flet
      - run: yes | flet build apk --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: bot-apk
          path: build/apk/*.apk
          
